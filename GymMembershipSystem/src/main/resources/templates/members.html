<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Members List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: #fff;
            padding: 30px;
            position: relative; /* ✅ added */
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffc107;
        }

        /* ✅ BACK BUTTON STYLE */
        .top-back-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            padding: 6px 16px;
            border: 1px solid #ffc107;
            color: #ffc107;
            border-radius: 6px;
            font-size: 14px;
            text-decoration: none;
            background: transparent;
            transition: 0.3s;
        }

        .top-back-btn:hover {
            background: #ffc107;
            color: #000;
            box-shadow: 0 0 10px rgba(255,193,7,0.6);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
        }

        th {
            background-color: #ffc107;
            color: #000;
            padding: 12px;
            text-align: center;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        tr:hover {
            background-color: #2a2a2a;
        }

        a {
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
        }

        a[href*="edit"] {
            background-color: #28a745;
            color: white;
        }

        a[href*="delete"] {
            background-color: #dc3545;
            color: white;
        }

        a:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<!-- ✅ BACK BUTTON -->
<a href="/trainer-dashboard" class="top-back-btn">← Back</a>

<h2>All Members</h2>

<table>
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Type</th>
    <th>Amount</th>
    <th>Actions</th>
</tr>

<tr th:each="m : ${members}">
    <td th:text="${m.id}"></td>
    <td th:text="${m.fullName}"></td>
    <td th:text="${m.email}"></td>
    <td th:text="${m.phone}"></td>
    <td th:text="${m.membershipType}"></td>
    <td th:text="${m.amount}"></td>
    <td>
        <a th:href="@{/edit/{id}(id=${m.id})}">Edit</a>
        <a th:href="@{/delete/{id}(id=${m.id})}">Delete</a>
    </td>
</tr>

</table>

</body>
</html>
