<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<title>UPI Payment</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#0f0f0f;
color:#fff;
font-family:'Segoe UI';
}

.payment-container{
max-width:500px;
margin:80px auto;
background:#1a1a1a;
padding:40px;
border-radius:15px;
text-align:center;
box-shadow:0 0 20px rgba(255,193,7,0.15);
}

.highlight{
color:#ffc107;
}

.qr-box{
background:#fff;
padding:20px;
border-radius:10px;
margin-top:20px;
}

</style>
</head>

<body>

<div class="payment-container">

<h3 class="highlight">UPI Payment</h3>
<p>Scan QR Code to complete your payment</p>

<div class="qr-box">

<!-- PUT YOUR REAL QR IMAGE -->
<img th:src="@{/images/img-QR.jpg}" width="250">

</div>

<br>

<a href="/renew-membership" class="btn btn-warning">
Back to Dashboard
</a>

</div>

</body>
</html>
