
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Membership Receipt</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#0f0f0f;
    font-family: 'Segoe UI', sans-serif;
    color:white;
}

/* MAIN CARD */

.receipt-container{
    max-width:750px;
    margin:60px auto;
    background:#1c1c1c;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
    overflow:hidden;
}

/* HEADER */

.receipt-header{
    background:linear-gradient(135deg,#ff7b00,#ff3d00);
    padding:25px 35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.receipt-header h2{
    margin:0;
    font-weight:700;
}

.gym-title{
    font-size:20px;
    font-weight:bold;
}

/* BODY */

.receipt-body{
    padding:40px;
}

/* MEMBER INFO TABLE */

.info-table{
    width:100%;
}

.info-table tr{
    border-bottom:1px solid #333;
}

.info-table td{
    padding:14px 0;
    font-size:17px;
}

.label{
    color:#aaa;
    width:40%;
}

.value{
    font-weight:500;
}

.amount{
    font-size:22px;
    font-weight:bold;
    color:#00e676;
}

/* FOOTER */

.receipt-footer{
    text-align:center;
    padding:30px;
}

/* BUTTONS */

.btn-print{
    background:#28a745;
    border:none;
    padding:10px 25px;
    margin-right:10px;
}

.btn-email{
    background:#ff3d00;
    border:none;
    padding:10px 25px;
}

/* THANK YOU */

.thank{
    margin-top:18px;
    color:#bbb;
    font-size:14px;
}

</style>
</head>

<body>

<div class="receipt-container">

<div class="receipt-header">
<div class="gym-title">🏋 Gym Management System</div>
<h2>Membership Receipt</h2>
</div>

<div class="receipt-body">

<table class="info-table">

<tr>
<td class="label">Member Name</td>
<td class="value" th:text="${member.fullName}"></td>
</tr>

<tr>
<td class="label">Email Address</td>
<td class="value" th:text="${member.email}"></td>
</tr>

<tr>
<td class="label">Membership Plan</td>
<td class="value" th:text="${member.membershipType}"></td>
</tr>

<tr>
<td class="label">Amount Paid</td>
<td class="amount">₹<span th:text="${member.amount}"></span></td>
</tr>

</table>

</div>

<div class="receipt-footer">

<button onclick="window.print()" class="btn btn-print">
🖨 Print Receipt
</button>

<a th:href="@{/sendReceipt(id=${member.id})}" class="btn btn-email">
📧 Send To Email
</a>

<div class="thank">
Thank you for training with us. Keep pushing your limits 💪
</div>

</div>

</div>

</body>
</html>
