<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Member</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f0f0f;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            min-height: 100vh;
        }

        .card {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(255,193,7,0.15);
            border: none;
        }

        h3 {
            color: #ffc107;
            font-weight: 600;
        }

        .form-label {
            color: #ccc;
            font-size: 14px;
        }

        .form-control {
            background: #111;
            border: 1px solid #333;
            color: #fff;
            border-radius: 10px;
            padding: 10px;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #ffc107;
            box-shadow: 0 0 8px rgba(255,193,7,0.4);
            background: #111;
            color: #fff;
        }

        .form-control::placeholder {
            color: #777;
        }

        /* readonly fields */
        .form-control.bg-light {
            background: #222 !important;
            color: #ffc107;
            font-weight: 500;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ffc107, #ff9800);
            border: none;
            border-radius: 30px;
            padding: 12px;
            font-weight: 600;
            color: #000;
            transition: 0.3s;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,193,7,0.4);
        }

        .container {
            min-height: 100vh;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center mt-5 mb-5">
    <div class="col-md-6">
        <div class="card shadow-lg">

            <h3 class="text-center mb-4">💪 Member Registration</h3>

            <form th:action="@{/saveMember}" th:object="${member}" method="post">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" th:field="*{fullName}" 
                           class="form-control" placeholder="Enter full name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" 
                           class="form-control" placeholder="Enter email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" th:field="*{password}" 
                           class="form-control" placeholder="Enter password" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" th:field="*{phone}" 
                           class="form-control" placeholder="Enter phone number" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Membership Type</label>
                    <input type="text" th:field="*{membershipType}" 
                           class="form-control bg-light" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Amount (₹)</label>
                    <input type="text" th:field="*{amount}" 
                           class="form-control bg-light" readonly>
                </div>

                <!-- ✅ Correct Button -->
                <button type="submit" class="btn btn-primary">
                    Save & Generate Receipt
                </button>

            </form>

        </div>
    </div>
</div>

</body>
</html>
